# ── LaneSync-managed workflow ─────────────────────────────────────────────
# This file is owned by LaneSync. Future "Update workflows" PRs may replace
# custom edits you make here. Review the PR diff before merging.
name: "Deploy to Production"
# LaneSync records a production deployment only for the verified candidate: keep the full
# candidate SHA in the run name. A dispatch runs on its own ref and names the candidate in its
# inputs; a GitHub deployment that LaneSync creates (as the person who pressed Deploy) carries it.
run-name: "Deploy ${{ inputs.release_version || github.event.deployment.payload.lanesync.release_version }} (${{ inputs.candidate_sha || github.event.deployment.sha }})"

on:
  # LaneSync's Deploy button creates a GitHub deployment of the approved candidate as the signed-in person.
  deployment:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'LaneSync release milestone version'
        required: true
        type: string
      candidate_sha:
        description: 'Exact verified commit to deploy'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  # Only to report this run's progress on the deployment that started it.
  deployments: write

jobs:
  deploy-production:
    name: "Deploy to Production"
    # A deployment starts this only when it is LaneSync's, for this environment and for its own commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'production' &&
      github.event.deployment.payload.lanesync.candidate_sha == github.event.deployment.sha)
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.event.deployment.payload.lanesync.release_version }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.deployment.sha }}
    steps:
      - name: Report deployment in progress
        if: github.event_name == 'deployment'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUSES_URL: ${{ github.event.deployment.statuses_url }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${STATUSES_URL}" -d "$(jq -n --arg log "$LOG_URL" '{state: "in_progress", log_url: $log}')" >/dev/null
      - name: Verify LaneSync deployment gate for this commit
        env:
          LANESYNC_API_URL: "https://unrelishable-erika-nonfactiously.ngrok-free.dev"
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lanesync" | jq -er .value)
          RESULT=$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer ${TOKEN}" \
            --data-urlencode "version=${RELEASE_VERSION}" \
            --data-urlencode "repo=${REPOSITORY}" \
            --data-urlencode "candidate_sha=${CANDIDATE_SHA}" \
            "${LANESYNC_API_URL}/api/milestones/check")
          if ! printf '%s' "$RESULT" | jq -e '.can_deploy == true and .candidate_sha == env.CANDIDATE_SHA' >/dev/null; then
            # Say why, and which commit LaneSync would deploy, instead of a bare exit code.
            printf '%s' "$RESULT" | jq -r '"::error title=LaneSync refused this deployment::" + ([(.reason // "The release gates have not passed."),
              (if .candidate_tag then "Release candidate: " + .candidate_tag else empty end),
              (if .candidate_sha then "Commit to deploy: " + .candidate_sha else empty end)] | join(" — "))'
            printf '%s' "$RESULT" | jq -r '(.blockers // {}) | to_entries[] | select((.value | length) > 0)
              | "Blocked at " + .key + ": " + (.value | if type == "array" then join(", ") else tostring end)' || true
            exit 1
          fi
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Deploy to production
        run: |
          echo "Deploying ${RELEASE_VERSION} (${CANDIDATE_SHA}) to production"
          node -e "console.log(require('./greet').greet('production'))"

      - name: Report deployment result
        if: always() && github.event_name == 'deployment'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUSES_URL: ${{ github.event.deployment.statuses_url }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${STATUSES_URL}" -d "$(jq -n --arg state "$STATE" --arg log "$LOG_URL" '{state: $state, log_url: $log}')" >/dev/null
